<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ورود اطلاعات فاکتور فروش طلا</title>
    <style>
        @font-face{font-family:IRANSans;font-style:normal;font-weight:300;src:url(./fonts/IRANSansWeb_Light.eot);src:url(./fonts/IRANSansWeb_Light.eot?#iefix) format("embedded-opentype"),url(./fonts/IRANSansWeb_Light.woff2) format("woff2"),url(./fonts/IRANSansWeb_Light.woff) format("woff"),url(./fonts/IRANSansWeb_Light.ttf) format("truetype")}
        * {
            box-sizing: border-box;
            font-family: 'IRANSans', 'Segoe UI', sans-serif;
        }
        body {
            background-color: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            margin: 0;
            min-height: 100vh;
        }
        .container {
            background-color: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 700px;
        }
        .header-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            border-bottom: 2px solid #f0e68c;
            padding-bottom: 12px;
        }
        .logo-img {
            width: 55px;
            height: 55px;
            object-fit: contain;
        }
        h2 {
            color: #b8860b;
            margin: 0;
            font-size: 19px;
        }
        .form-row {
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }
        .form-group {
            flex: 1;
            min-width: 200px;
            display: flex;
            flex-direction: column;
        }
        label {
            font-size: 13px;
            margin-bottom: 5px;
            color: #333;
            font-weight: bold;
        }
        input, textarea {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s;
        }
        input:focus, textarea:focus {
            border-color: #b8860b;
        }
        .btn-submit {
            background-color: #b8860b;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            margin-top: 15px;
            transition: background-color 0.3s;
        }
        .btn-submit:hover {
            background-color: #966f0d;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header-section">
        <h2>صدور فاکتور گالری طلا و جواهر نوآ</h2>
        <img src="img/logo.png" alt="لوگو گالری طلا و جواهر نوآ" class="logo-img">
    </div>

    <form action="receipt.html" method="GET">
        <div class="form-row">
            <div class="form-group">
                <label>شماره فاکتور:</label>
                <input type="text" name="factor_no" class="only-numbers" required placeholder="مثال: ۱۲۳۴">
            </div>
            <div class="form-group">
                <label>تاریخ (شمسی):</label>
                <input type="text" id="date_input" name="date" required placeholder="۱۴۰۳/۰۱/۰۱">
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label>نام خریدار:</label>
                <input type="text" name="customer_name" required placeholder="نام و نام خانوادگی">
            </div>
            <div class="form-group">
                <label>تلفن خریدار:</label>
                <input type="text" name="customer_phone" class="only-numbers" placeholder="۰۹۱۲...">
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label>کدملی خریدار:</label>
                <input type="text" name="customer_national_id" placeholder="کد ملی">
            </div>
            <div class="form-group">
                <label>قیمت ۱ گرم طلای آب شده 18 عیار (ریال):</label>
                <input type="text" id="gold_price" name="gold_price" class="currency-input" required placeholder="مثال: ۴۱,۶۰۰,۰۰۰">
            </div>
        </div>

        <hr style="border: 0; border-top: 1px dashed #ccc; margin: 20px 0;">

        <h4>مشخصات جنس:</h4>
        <div class="form-row">
            <div class="form-group" style="flex: 2;">
                <label>نوع جنس (شرح کالا):</label>
                <input type="text" name="item_name" required placeholder="مثال: انگشتر سولتر آوا">
            </div>
            <div class="form-group">
                <label>عیار:</label>
                <input type="text" id="item_purity" name="item_purity" class="only-numbers" value="750" required>
            </div>
        </div>

        <div class="form-row">
            <div class="form-group" style="flex: 1.5;">
                <label>وزن (گرم - اعشاری):</label>
                <input type="text" id="weight_g" name="weight_g" class="decimal-input" required placeholder="مثال: 2.12">
            </div>
            <div class="form-group" style="flex: 1.5;">
                <label>اجرت (% یا مبلغ):</label>
                <input type="text" id="wage_percent" name="wage_percent" class="only-numbers" placeholder="مثال: 12">
            </div>
            <div class="form-group">
                <label>قیمت هر گرم (ریال):</label>
                <input type="text" id="unit_price" name="unit_price" class="currency-input" readonly placeholder="محاسبه خودکار">
            </div>
            <div class="form-group">
                <label>قیمت کل (ریال):</label>
                <input type="text" id="total_price" name="total_price" class="currency-input" required readonly placeholder="محاسبه خودکار">
            </div>
        </div>

        <button type="submit" class="btn-submit" target="_blank">ثبت و مشاهده فاکتور A5</button>
    </form>
</div>

<script>
    function getJalaliToday() {
        const today = new Date();
        const options = { year: 'numeric', month: '2-digit', day: '2-digit' };
        return new Intl.DateTimeFormat('fa-IR-u-nu-latn', options).format(today);
    }
    document.getElementById('date_input').value = getJalaliToday();

    function faToEnDigits(str) {
        if (!str) return '';
        return String(str).replace(/[۰-۹]/g, function(w) {
            const persianDigits = ['۰', '۱', '۲', '۳', '۴', '۵', '۶', '۷', '۸', '۹'];
            return persianDigits.indexOf(w);
        });
    }

    function formatNumber(num) {
        if (isNaN(num) || num === '') return '';
        return Number(num).toLocaleString('en-US');
    }

    function cleanNumber(str) {
        let cleaned = faToEnDigits(str).replace(/,/g, '');
        return Number(cleaned) || 0;
    }

    document.querySelectorAll('.currency-input').forEach(input => {
        input.addEventListener('input', function(e) {
            let value = cleanNumber(e.target.value);
            e.target.value = value ? formatNumber(value) : '';
        });
    });

    document.querySelectorAll('.only-numbers').forEach(input => {
        input.addEventListener('input', function(e) {
            e.target.value = faToEnDigits(e.target.value).replace(/\D/g, '');
            calculatePrice();
        });
    });

    const weightInput = document.getElementById('weight_g');
    weightInput.addEventListener('input', function(e) {
        let val = faToEnDigits(e.target.value);
        val = val.replace(/[^0-9.]/g, '');
        let parts = val.split('.');
        if (parts.length > 2) {
            val = parts[0] + '.' + parts.slice(1).join('');
        }
        e.target.value = val;
        calculatePrice();
    });

    document.getElementById('gold_price').addEventListener('input', function() {
        let val = cleanNumber(this.value);
        this.value = val ? formatNumber(val) : '';
        calculatePrice();
    });

    function calculatePrice() {
        let goldPrice = cleanNumber(document.getElementById('gold_price').value);
        let purity = cleanNumber(document.getElementById('item_purity').value) || 750;
        let totalWeight = parseFloat(faToEnDigits(weightInput.value)) || 0;
        let wagePercent = cleanNumber(document.getElementById('wage_percent').value);

        if (goldPrice > 0 && totalWeight > 0) {
            let basePricePerGram = (goldPrice / 750) * purity;
            let priceWithWage = basePricePerGram * (1 + (wagePercent / 100));
            let unitPrice = priceWithWage * 1.0869642857;
            let totalPrice = unitPrice * totalWeight;

            document.getElementById('unit_price').value = formatNumber(Math.round(unitPrice));
            document.getElementById('total_price').value = formatNumber(Math.round(totalPrice));
        } else {
            document.getElementById('unit_price').value = '';
            document.getElementById('total_price').value = '';
        }
    }
</script>

</body>
</html>
