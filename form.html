<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ورود اطلاعات فاکتور فروش طلا</title>
    <style>
        @font-face{font-family:IRANSans;font-style:normal;font-weight:300;src:url(./fonts/IRANSansWeb_Light.eot);src:url(./fonts/IRANSansWeb_Light.eot?#iefix) format("embedded-opentype"),url(./fonts/IRANSansWeb_Light.woff2) format("woff2"),url(./fonts/IRANSansWeb_Light.woff) format("woff"),url(./fonts/IRANSansWeb_Light.ttf) format("truetype")}
        * {
            box-sizing: border-box;
            font-family: 'IRANSans', 'Segoe UI', sans-serif;
        }
        body {
            background-color: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            margin: 0;
            min-height: 100vh;
        }
        .container {
            background-color: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 800px;
        }
        .header-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            border-bottom: 2px solid #f0e68c;
            padding-bottom: 12px;
        }
        .logo-img {
            width: 55px;
            height: 55px;
            object-fit: contain;
        }
        h2 {
            color: #b8860b;
            margin: 0;
            font-size: 19px;
        }
        .form-row {
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }
        .form-group {
            flex: 1;
            min-width: 180px;
            display: flex;
            flex-direction: column;
        }
        label {
            font-size: 13px;
            margin-bottom: 5px;
            color: #333;
            font-weight: bold;
        }
        input, textarea {
            padding: 10px 15px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s;
            background-color: #fff;
        }
        select {
            padding: 10px 15px 10px 30px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s;
            background-color: #fff;
            appearance: none;
            -webkit-appearance: none;
            -moz-appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23333' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: left 10px center;
            background-size: 14px;
        }
        input:focus, select:focus, textarea:focus {
            border-color: #b8860b;
        }
        .product-item {
            background: #faf7eb;
            padding: 15px;
            border-radius: 8px;
            border: 1px dashed #b8860b;
            margin-bottom: 15px;
            position: relative;
        }
        .btn-danger {
            background-color: #dc3545;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            margin-top: 5px;
            align-self: flex-end;
        }
        .btn-add {
            background-color: #17a2b8;
            color: white;
            border: none;
            padding: 10px 15px;
            font-size: 14px;
            border-radius: 6px;
            cursor: pointer;
            margin-bottom: 15px;
        }
        .btn-submit {
            background-color: #b8860b;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            margin-top: 15px;
            transition: background-color 0.3s;
        }
        .btn-submit:hover {
            background-color: #966f0d;
        }
        .sub-type-container {
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header-section">
        <h2>صدور فاکتور گالری طلا و جواهر نوآ</h2>
        <img src="img/logo.png" alt="لوگو گالری طلا و جواهر نوآ" class="logo-img">
    </div>

    <form id="invoiceForm" action="receipt.html" method="GET" onsubmit="prepareData(event)">
        <div class="form-row">
            <div class="form-group">
                <label>شماره فاکتور:</label>
                <input type="text" name="factor_no" class="only-numbers" required placeholder="مثال: ۱۲۳۴">
            </div>
            <div class="form-group">
                <label>تاریخ (شمسی):</label>
                <input type="text" id="date_input" name="date" required placeholder="۱۴۰۳/۰۱/۰۱">
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label>نام خریدار:</label>
                <input type="text" name="customer_name" required placeholder="نام و نام خانوادگی">
            </div>
            <div class="form-group">
                <label>تلفن خریدار:</label>
                <input type="text" name="customer_phone" class="only-numbers" placeholder="۰۹۱۲...">
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label>کدملی خریدار:</label>
                <input type="text" name="customer_national_id" placeholder="کد ملی">
            </div>
            <div class="form-group">
                <label>قیمت ۱ گرم طلای آب شده 18 عیار (ریال):</label>
                <input type="text" id="gold_price" name="gold_price" class="currency-input" required placeholder="مثال: ۴۱,۶۰۰,۰۰۰">
            </div>
        </div>

        <hr style="border: 0; border-top: 1px dashed #ccc; margin: 20px 0;">

        <h4>مشخصات اقلام فاکتور:</h4>
        <div id="products-container">
            <!-- کانتینر محصولات پویا -->
        </div>

        <button type="button" class="btn-add" onclick="addProductRow()">+ افزودن محصول جدید</button>
        
        <!-- فیلد پنهان برای ارسال کل محصولات به صفحه رسید -->
        <input type="hidden" name="items_data" id="items_data">

        <button type="submit" class="btn-submit">ثبت و مشاهده فاکتور A5</button>
    </form>
</div>

<script>
    function getJalaliToday() {
        const today = new Date();
        const options = { year: 'numeric', month: '2-digit', day: '2-digit' };
        return new Intl.DateTimeFormat('fa-IR-u-nu-latn', options).format(today);
    }
    document.getElementById('date_input').value = getJalaliToday();

    function faToEnDigits(str) {
        if (!str) return '';
        return String(str).replace(/[۰-۹]/g, function(w) {
            const persianDigits = ['۰', '۱', '۲', '۳', '۴', '۵', '۶', '۷', '۸', '۹'];
            return persianDigits.indexOf(w);
        });
    }

    function formatNumber(num) {
        if (isNaN(num) || num === '') return '';
        return Number(num).toLocaleString('en-US');
    }

    function cleanNumber(str) {
        let cleaned = faToEnDigits(str).replace(/,/g, '');
        return Number(cleaned) || 0;
    }

    // افزودن سطر محصول جدید
    function addProductRow() {
        const container = document.getElementById('products-container');
        const rowId = Date.now();
        
        const html = `
            <div class="product-item" id="row_${rowId}">
                <div class="form-row">
                    <div class="form-group">
                        <label>نوع کالا:</label>
                        <select class="p_type" onchange="handleTypeChange(this)">
                            <option value="آبشده">آبشده</option>
                            <option value="طلای زینتی">طلای زینتی</option>
                        </select>
                    </div>
                    <div class="form-group sub-type-container">
                        <label>نوع طلای زینتی:</label>
                        <select class="p_subtype">
                            <option value="گوشواره">گوشواره</option>
                            <option value="دستبند">دستبند</option>
                            <option value="زنجیر">زنجیر</option>
                            <option value="پلاک">پلاک</option>
                            <option value="زنجیر و پلاک">زنجیر و پلاک</option>
                            <option value="نیم ست">نیم ست</option>
                            <option value="سرویس">سرویس</option>
                            <option value="پیرسینگ">پیرسینگ</option>
                        </select>
                    </div>
                    <div class="form-group" style="flex: 2;">
                        <label>شرح جزئیات کالا:</label>
                        <input type="text" class="p_name" placeholder="مثال: سولتر آوا">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>عیار:</label>
                        <input type="text" class="p_purity only-nums" value="750" required>
                    </div>
                    <div class="form-group">
                        <label>وزن (گرم):</label>
                        <input type="text" class="p_weight decimal-inp" required placeholder="مثال: 2.12">
                    </div>
                    <div class="form-group">
                        <label>اجرت (%):</label>
                        <input type="text" class="p_wage decimal-inp" value="2" placeholder="مثال: 12.5">
                    </div>
                    <div class="form-group">
                        <label>قیمت کل (ریال):</label>
                        <input type="text" class="p_total currency-inp" readonly placeholder="محاسبه خودکار">
                    </div>
                </div>
                <button type="button" class="btn-danger" onclick="removeProductRow('row_${rowId}')">حذف این محصول</button>
            </div>
        `;
        container.insertAdjacentHTML('beforeend', html);
        const newRow = document.getElementById(`row_${rowId}`);
        initRowEvents(newRow);
        calculateRow(newRow);
    }

    function handleTypeChange(selectElement) {
        const rowElement = selectElement.closest('.product-item');
        const subTypeContainer = rowElement.querySelector('.sub-type-container');
        const wageInput = rowElement.querySelector('.p_wage');

        if (selectElement.value === 'طلای زینتی') {
            subTypeContainer.style.display = 'flex';
            wageInput.value = ''; // خالی گذاشتن اجرت برای طلای زینتی
        } else {
            subTypeContainer.style.display = 'none';
            wageInput.value = '2'; // پیش‌فرض آبشده ۲ درصد
        }
        calculateRow(rowElement);
    }

    function removeProductRow(rowId) {
        const row = document.getElementById(rowId);
        if (document.querySelectorAll('.product-item').length > 1) {
            row.remove();
        } else {
            alert('حداقل وجود یک محصول در فاکتور الزامی است.');
        }
    }

    function initRowEvents(rowElement) {
        rowElement.querySelectorAll('.only-nums').forEach(input => {
            input.addEventListener('input', function(e) {
                e.target.value = faToEnDigits(e.target.value).replace(/\D/g, '');
                calculateRow(rowElement);
            });
        });

        rowElement.querySelectorAll('.decimal-inp').forEach(input => {
            input.addEventListener('input', function(e) {
                let val = faToEnDigits(e.target.value).replace(/[^0-9.]/g, '');
                let parts = val.split('.');
                if (parts.length > 2) val = parts[0] + '.' + parts.slice(1).join('');
                e.target.value = val;
                calculateRow(rowElement);
            });
        });
    }

    document.getElementById('gold_price').addEventListener('input', function() {
        let val = cleanNumber(this.value);
        this.value = val ? formatNumber(val) : '';
        document.querySelectorAll('.product-item').forEach(row => calculateRow(row));
    });

    function calculateRow(rowElement) {
        let goldPrice = cleanNumber(document.getElementById('gold_price').value);
        let purity = cleanNumber(rowElement.querySelector('.p_purity').value) || 750;
        let weight = parseFloat(faToEnDigits(rowElement.querySelector('.p_weight').value)) || 0;
        let wagePercent = parseFloat(faToEnDigits(rowElement.querySelector('.p_wage').value)) || 0;
        let productType = rowElement.querySelector('.p_type').value;

        if (goldPrice > 0 && weight > 0) {
            let basePricePerGram = (goldPrice / 750) * purity;
            let priceWithWage = basePricePerGram * (1 + (wagePercent / 100));
            
            let unitPrice;
            if (productType === 'آبشده') {
                // برای آبشده فقط اجرت اعمال می‌شود و مالیات/سود اضافه نمی‌شود
                unitPrice = priceWithWage;
            } else {
                // برای طلای زینتی ضریب مالیات و سود (معادل 1.08696...) لحاظ می‌شود
                unitPrice = priceWithWage * 1.0869642857;
            }
            
            let totalPrice = unitPrice * weight;

            rowElement.querySelector('.p_total').value = formatNumber(Math.round(totalPrice));
        } else {
            rowElement.querySelector('.p_total').value = '';
        }
    }

    function prepareData(e) {
        const rows = document.querySelectorAll('.product-item');
        let items = [];

        rows.forEach(row => {
            let type = row.querySelector('.p_type').value;
            let subtype = type === 'طلای زینتی' ? row.querySelector('.p_subtype').value : '';
            
            items.push({
                type: type,
                subtype: subtype,
                name: row.querySelector('.p_name').value,
                purity: row.querySelector('.p_purity').value,
                weight: row.querySelector('.p_weight').value,
                wage: row.querySelector('.p_wage').value || '۰',
                total: row.querySelector('.p_total').value
            });
        });

        document.getElementById('items_data').value = JSON.stringify(items);
    }

    window.onload = function() {
        addProductRow();
    };
</script>

</body>
</html>
